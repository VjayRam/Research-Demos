[project]
name = "turboquant"
version = "0.1.0"
description = "Paper-accurate implementation of TurboQuant and PolarQuant vector quantization"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
examples = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "datasets>=2.19",
]
test = [
    "pytest>=7.0",
]
# triton has no Windows wheels on PyPI; triton-windows is a Windows-wheel fork with the same API.
kernel = [
    "triton>=3.0; sys_platform == 'linux'",
    "triton-windows>=3.7.0; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["turboquant*"]
